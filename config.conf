# ============================================================================
# dtbo_charge_unlock 配置
# 修改后重新执行即可生效（KernelSU 的「操作」按钮，或 WebUI 的「运行修改」）：
#   su -c "sh /data/adb/modules/dtbo_charge_unlock/action.sh"
# 开机阶段不会自动刷写；系统 OTA 之后同样要点一次上面的按钮。
# 行首加 # 表示注释掉该行（回落到默认值）。
# ============================================================================

# ---- FFC（全速充电）温度窗口，单位 ℃ --------------------------------------
# 参考表（1.txt 提取）里的高温边界是 55℃；设成 56 就是把 0~55 的全速窗口
# 扩展到 0~56。置空（FFC_TEMP_HIGH=）表示完全沿用参考表原始数值。
#
# 安装时会让你用音量键选档位，选完会直接改写下面这两行的 FFC_TEMP_HIGH：
#   音量下键 = 安全档 0~48℃
#   音量上键 = 极限档 0~56℃
FFC_TEMP_LOW=0
FFC_TEMP_HIGH=56

# ---- 档位（可选：跳过安装时的按键选择） ------------------------------------
# 留空 = 安装时用音量键选（不按则保持上面的 FFC_TEMP_HIGH）。
# safe = 强制安全档 0~48℃ 全速
# max  = 强制极限档 0~56℃ 全速
FORCE_TIER=

# 参考表里实际使用的高温/低温边界值。除非换了另一份参考 dts，否则不要改。
FFC_REF_HIGH=55
FFC_REF_LOW=0

# ---- 开关 ------------------------------------------------------------------
# 1 = 忽略「已经刷过」的判断，强制重新解包-改写-打包-刷写一次。
#     只在分区内容已经是本模块刷的版本、又确实想再刷一遍时才需要；
#     只改了上面的温度档位的话不用动它，模块会自己发现档位变了并重刷。
FORCE=0

# 1 = 只做解包 / 改写 / 打包 / 复核，不写分区（演练模式）。
#     产物留在 /dev/dtbo_charge_unlock/new.img。第一次用建议先设 1 看日志。
DRY_RUN=0

# ---- 槽位 ------------------------------------------------------------------
# 留空 = 自动识别（正常安装都走这条）。
# 填 a 或 b = 强制指定槽位。只有在恢复模式里装、自动识别不出槽位时才需要。
FORCE_SLOT=

# ---- 充电日志（WebUI 的「充电日志」标签页） --------------------------------
# 开机后由 service.sh 拉起一个后台进程，插上充电器开始记录、拔出结束。
# 只读 /sys，只往下面的目录写文本文件，不碰分区。
CHARGELOG=1

# 采样间隔（秒）。越小曲线越细，日志也越大；30 秒一次一小时约 120 行。
CHARGELOG_INTERVAL=30

# 最多保留多少个会话（超出后删最旧的）。
CHARGELOG_MAX=40

# 日志目录。留空 = /data/adb/dtbo_charge_unlock/chargelog
# 特意放在模块目录外面：这样升级模块不会把历史记录一起删掉。
CHARGELOG_DIR=

# ---- 安装阶段 --------------------------------------------------------------
# 安装时如果刷写失败（例如分区只读），是否直接中止安装。
#   0 = 继续安装模块，之后可以手动再点「操作」/「运行修改」重试（默认）
#   1 = 直接中止，不留下模块
ABORT_ON_INSTALL_FAIL=0
